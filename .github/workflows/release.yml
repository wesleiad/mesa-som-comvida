# Cada envio pro branch main gera um instalador novo e publica como Release.
# O programa instalado na igreja procura essas Releases e se atualiza sozinho.
name: Publicar versão

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versão automática (1.0.<número da execução>)
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npx electron-vite build
      - name: Gerar instalador e publicar Release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
